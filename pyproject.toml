[project]
name = "erns-shared"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ernesto", email = "ernes920825@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "boto3>=1.34",
    "backoff>=2.0",
    "aws-lambda-powertools[tracer]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "moto[s3,dynamodb,ssm]>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
